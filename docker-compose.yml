services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: topup
      POSTGRES_PASSWORD: topup
      POSTGRES_DB: topup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topup -d topup"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://topup:topup@postgres:5432/topup
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  bot:
    build: ./bot
    environment:
      DATABASE_URL: postgres://topup:topup@postgres:5432/topup
      FAIL_RATE: "0.1"
      CRASH_RATE: "0.05"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

volumes:
  pgdata:
